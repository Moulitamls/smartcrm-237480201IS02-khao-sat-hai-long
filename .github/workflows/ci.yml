name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (pytest + pipeline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -q src

      - name: Run pipeline on real CSV (reconcile must pass)
        run: python -m src.pipeline | tee pipeline.log

      - name: Check reconcile result
        run: grep -q "ĐẠT" pipeline.log

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t csat-ci .

      - name: Start container like Render (pipeline then Streamlit)
        run: |
          docker run -d --name csat -p 10000:10000 \
            -e PORT=10000 -e CSAT_CONFIG=src/config.docker.yaml csat-ci

      - name: Wait for health check
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:10000/_stcore/health | grep -q ok; then
              echo "healthy"; exit 0
            fi
            sleep 2
          done
          docker logs csat
          exit 1

      - name: Show container logs
        if: always()
        run: docker logs csat
